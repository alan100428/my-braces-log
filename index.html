<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Braces Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 pb-20">

    <!-- Header -->
    <header class="bg-teal-600 text-white p-4 text-center font-black text-xl tracking-wider shadow-sm sticky top-0 z-40">
        🦷 My Braces Log
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- ================= PAGE 1: 總覽 & 新增看診 ================= -->
        <div id="pageNew" class="space-y-4">
            
            <!-- 顯眼：下次回診提醒卡片 -->
            <div class="bg-gradient-to-r from-teal-600 to-teal-700 text-white p-4 rounded-2xl shadow-md relative overflow-hidden">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-xs font-bold tracking-wider text-teal-100 uppercase">📅 下次回診時間</span>
                    <!-- 隱藏式修改：點擊小鉛筆圖示即可更新 -->
                    <button id="btnEditNextAppointment" class="text-teal-200 hover:text-white p-1 text-sm transition" title="修改下次回診">
                        ✏️
                    </button>
                </div>
                <div class="flex items-baseline space-x-2 mt-1">
                    <span id="nextApptDate" class="text-2xl font-black">尚未設定</span>
                    <span id="nextApptTime" class="text-base font-bold text-teal-100"></span>
                </div>
                <div id="nextApptCountdown" class="text-[11px] text-teal-200 mt-2 font-medium">
                    請於下方新增紀錄或點擊 ✏️ 設定回診時間
                </div>
            </div>

            <!-- 數據統計 -->
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white p-3.5 rounded-xl border border-gray-100 shadow-sm text-center">
                    <div class="text-[11px] text-gray-400 font-bold mb-0.5">累積總花費</div>
                    <div class="text-lg font-black text-teal-600" id="totalCost">NT$ 0</div>
                </div>
                <div class="bg-white p-3.5 rounded-xl border border-gray-100 shadow-sm text-center">
                    <div class="text-[11px] text-gray-400 font-bold mb-0.5">總看診次數</div>
                    <div class="text-lg font-black text-gray-800"><span id="totalVisits">0</span> 次</div>
                </div>
            </div>

            <!-- 新增紀錄表單 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
                <h3 class="font-bold text-sm text-gray-800 border-b pb-2 flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-teal-600"></span> 新增本次看診紀錄
                </h3>

                <form id="visitForm" class="space-y-3 text-xs">
                    
                    <!-- 本次看診日期與費用 -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-bold text-gray-600 mb-1">看診日期 <span class="text-red-500">*</span></label>
                            <input type="date" id="visitDate" class="w-full border rounded-xl p-2.5 bg-gray-50 focus:bg-white outline-none" required>
                        </div>
                        <div>
                            <label class="block font-bold text-gray-600 mb-1">常規分期費用 (元)</label>
                            <input type="number" id="baseFee" value="3000" placeholder="3000" class="w-full border rounded-xl p-2.5 bg-gray-50 focus:bg-white outline-none">
                        </div>
                    </div>

                    <!-- 額外/開藥/補蛀牙 -->
                    <div class="p-3 bg-teal-50/60 border border-teal-100/80 rounded-xl space-y-2">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="hasCavity" class="w-4 h-4 text-teal-600 rounded focus:ring-teal-500">
                            <span class="font-bold text-teal-900">當次有開藥 / 補蛀牙</span>
                        </label>

                        <div id="cavityFeeBox" class="hidden pl-6 pt-1">
                            <label class="block font-bold text-teal-800 mb-1">額外掛號 / 藥費 (元)</label>
                            <input type="number" id="extraFee" value="200" placeholder="例如：200" class="w-full border rounded-lg p-2 bg-white outline-none">
                        </div>
                    </div>

                    <!-- 診療項目 -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="font-bold text-gray-600">診療項目</label>
                            <button type="button" id="btnQuickAdjust" class="bg-teal-100 text-teal-800 text-[11px] font-bold px-2 py-0.5 rounded-md hover:bg-teal-200 transition">
                                ＋ 調整
                            </button>
                        </div>
                        <input type="text" id="treatments" placeholder="例：調整、換橡皮筋" class="w-full border rounded-xl p-2.5 bg-gray-50 focus:bg-white outline-none">
                    </div>

                    <!-- 備註 -->
                    <div>
                        <label class="block font-bold text-gray-600 mb-1">備註 / 醫囑紀錄</label>
                        <textarea id="notes" rows="2" placeholder="例：下排右側橡皮筋每天更換..." class="w-full border rounded-xl p-2.5 bg-gray-50 focus:bg-white outline-none resize-none"></textarea>
                    </div>

                    <!-- 設定預約下一次 -->
                    <div class="border-t pt-3 mt-2">
                        <label class="block font-bold text-teal-800 mb-1">預約下一次回診 (選填)</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="date" id="nextDateInput" class="border rounded-xl p-2.5 bg-gray-50 focus:bg-white outline-none">
                            <input type="time" id="nextTimeInput" class="border rounded-xl p-2.5 bg-gray-50 focus:bg-white outline-none">
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-teal-600 text-white font-bold py-3 rounded-xl hover:bg-teal-700 transition shadow-md mt-2">
                        儲存紀錄
                    </button>
                </form>
            </div>
        </div>

        <!-- ================= PAGE 2: 看診歷史紀錄 ================= -->
        <div id="pageHistory" class="space-y-3 hidden">
            <h3 class="font-bold text-sm text-gray-700 px-1 flex items-center justify-between">
                <span>看診歷史紀錄</span>
                <span class="text-xs font-normal text-gray-400">最新紀錄在最上方</span>
            </h3>

            <div id="historyList" class="space-y-3">
                <div class="text-center py-12 text-gray-400 text-xs">載入紀錄中...</div>
            </div>
        </div>

    </main>

    <!-- 底部 Tab 導覽列 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 z-40 max-w-md mx-auto">
        <div class="grid grid-cols-2 text-center text-xs">
            <button id="tabBtnNew" class="py-3 font-bold text-teal-600 border-t-2 border-teal-600 flex flex-col items-center gap-0.5">
                <span>➕</span>
                <span>新增紀錄</span>
            </button>
            <button id="tabBtnHistory" class="py-3 font-bold text-gray-400 flex flex-col items-center gap-0.5">
                <span>📋</span>
                <span>看診歷史</span>
            </button>
        </div>
    </nav>

    <!-- Modal 1: 僅修改下次回診日期/時間 -->
    <div id="nextApptModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl p-4 w-full max-w-sm space-y-3 shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-gray-800">修改下次回診時間</h3>
                <button id="closeNextApptModal" class="text-gray-400 hover:text-black font-bold text-base">✕</button>
            </div>
            <form id="nextApptForm" class="space-y-3 text-xs">
                <div>
                    <label class="font-bold text-gray-600">下次回診日期</label>
                    <input type="date" id="modalNextDate" class="w-full border rounded-xl p-2.5 mt-1" required>
                </div>
                <div>
                    <label class="font-bold text-gray-600">看診時間</label>
                    <input type="time" id="modalNextTime" class="w-full border rounded-xl p-2.5 mt-1">
                </div>
                <button type="submit" class="w-full bg-teal-600 text-white font-bold py-2.5 rounded-xl shadow">更新時間</button>
            </form>
        </div>
    </div>

    <!-- Modal 2: 編輯歷史看診紀錄 (不包含下次回診設定) -->
    <div id="editModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl p-4 w-full max-w-sm space-y-3 shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-gray-800">編輯看診紀錄</h3>
                <button id="closeEditModal" class="text-gray-400 hover:text-black font-bold text-base">✕</button>
            </div>
            <form id="editForm" class="space-y-3 text-xs">
                <input type="hidden" id="editRecordId">
                <div>
                    <label class="font-bold text-gray-600">看診日期</label>
                    <input type="date" id="editDate" class="w-full border rounded-xl p-2.5 mt-1" required>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="font-bold text-gray-600">常規費用 (元)</label>
                        <input type="number" id="editBaseFee" class="w-full border rounded-xl p-2.5 mt-1">
                    </div>
                    <div>
                        <label class="font-bold text-gray-600">額外費用 (元)</label>
                        <input type="number" id="editExtraFee" class="w-full border rounded-xl p-2.5 mt-1">
                    </div>
                </div>
                <div>
                    <label class="font-bold text-gray-600">診療項目</label>
                    <input type="text" id="editTreatments" class="w-full border rounded-xl p-2.5 mt-1">
                </div>
                <div>
                    <label class="font-bold text-gray-600">備註</label>
                    <textarea id="editNotes" rows="2" class="w-full border rounded-xl p-2.5 mt-1 resize-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-teal-600 text-white font-bold py-2.5 rounded-xl shadow">更新資料</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyBwF163OMp-1sPCV9xHsORYemEy97YPCkI",
            authDomain: "mywardrobe-c7e74.firebaseapp.com",
            databaseURL: "https://mywardrobe-c7e74-default-rtdb.firebaseio.com",
            projectId: "mywardrobe-c7e74",
            storageBucket: "mywardrobe-c7e74.firebasestorage.app",
            messagingSenderId: "629621991380",
            appId: "1:629621991380:web:5ab788261e3ec50a79d841"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const bracesRef = ref(db, 'braces_records');
        const nextApptRef = ref(db, 'braces_next_appt');

        let allRecords = {};
        let activeMenuId = null; // 控制選單彈出

        // 預設當天日期
        document.getElementById('visitDate').value = new Date().toISOString().split('T')[0];

        // 切換 Tab
        const pageNew = document.getElementById('pageNew');
        const pageHistory = document.getElementById('pageHistory');
        const tabBtnNew = document.getElementById('tabBtnNew');
        const tabBtnHistory = document.getElementById('tabBtnHistory');

        tabBtnNew.addEventListener('click', () => {
            pageNew.classList.remove('hidden');
            pageHistory.classList.add('hidden');
            tabBtnNew.className = "py-3 font-bold text-teal-600 border-t-2 border-teal-600 flex flex-col items-center gap-0.5";
            tabBtnHistory.className = "py-3 font-bold text-gray-400 flex flex-col items-center gap-0.5";
        });

        tabBtnHistory.addEventListener('click', () => {
            pageHistory.classList.remove('hidden');
            pageNew.classList.add('hidden');
            tabBtnHistory.className = "py-3 font-bold text-teal-600 border-t-2 border-teal-600 flex flex-col items-center gap-0.5";
            tabBtnNew.className = "py-3 font-bold text-gray-400 flex flex-col items-center gap-0.5";
        });

        // 快速輸入「調整」
        const treatmentsInput = document.getElementById('treatments');
        document.getElementById('btnQuickAdjust').addEventListener('click', () => {
            const currentVal = treatmentsInput.value.trim();
            if (!currentVal) {
                treatmentsInput.value = '調整';
            } else if (!currentVal.includes('調整')) {
                treatmentsInput.value = '調整、' + currentVal;
            }
            treatmentsInput.focus();
        });

        // 切換開藥/補蛀牙費用輸入
        const hasCavityCheckbox = document.getElementById('hasCavity');
        const cavityFeeBox = document.getElementById('cavityFeeBox');
        hasCavityCheckbox.addEventListener('change', (e) => {
            cavityFeeBox.classList.toggle('hidden', !e.target.checked);
        });

        // 監聽下次回診時間
        onValue(nextApptRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.date) {
                document.getElementById('nextApptDate').innerText = data.date;
                document.getElementById('nextApptTime').innerText = data.time || '';
                document.getElementById('modalNextDate').value = data.date;
                document.getElementById('modalNextTime').value = data.time || '';
                
                // 算倒數天數
                const today = new Date().setHours(0,0,0,0);
                const target = new Date(data.date).setHours(0,0,0,0);
                const diffDays = Math.ceil((target - today) / (1000 * 60 * 60 * 24));

                if (diffDays === 0) {
                    document.getElementById('nextApptCountdown').innerText = '🔥 就是今天！記得準時看診喔！';
                } else if (diffDays > 0) {
                    document.getElementById('nextApptCountdown').innerText = `⏳ 距離回診還有 ${diffDays} 天`;
                } else {
                    document.getElementById('nextApptCountdown').innerText = '⚠️ 預約時間已過，請記得點 ✏️ 更新下一次時間';
                }
            } else {
                document.getElementById('nextApptDate').innerText = '尚未設定';
                document.getElementById('nextApptTime').innerText = '';
                document.getElementById('nextApptCountdown').innerText = '請於下方新增紀錄或點擊 ✏️ 設定回診時間';
            }
        });

        // 監聽看診歷史
        onValue(bracesRef, (snapshot) => {
            allRecords = snapshot.val() || {};
            renderHistory();
        });

        // 渲染歷史清單
        function renderHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';

            const keys = Object.keys(allRecords);
            
            if (keys.length === 0) {
                historyList.innerHTML = `<div class="text-center py-12 text-gray-400 text-xs">目前尚無歷史紀錄</div>`;
                document.getElementById('totalCost').innerText = 'NT$ 0';
                document.getElementById('totalVisits').innerText = '0';
                return;
            }

            keys.sort((a, b) => new Date(allRecords[b].date) - new Date(allRecords[a].date));

            let totalSpent = 0;

            keys.forEach((id) => {
                const item = allRecords[id];
                const base = Number(item.baseFee) || 0;
                const extra = item.hasCavity ? (Number(item.extraFee) || 0) : 0;
                const totalFee = base + extra;
                totalSpent += totalFee;

                const card = document.createElement('div');
                card.className = "bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm space-y-2 relative";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs font-black text-gray-800">${item.date}</span>
                            ${item.hasCavity ? `<span class="ml-2 bg-amber-50 text-amber-800 border border-amber-200/60 text-[10px] px-1.5 py-0.5 rounded-md font-bold">💊 開藥/補蛀牙</span>` : ''}
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="text-sm font-black text-teal-600">NT$ ${totalFee.toLocaleString()}</span>
                            
                            <!-- 隱藏式三點選單按鈕 -->
                            <div class="relative">
                                <button data-id="${id}" class="menu-btn text-gray-400 hover:text-black font-bold p-1 rounded-md text-base leading-none">
                                    ⋮
                                </button>
                                <!-- 展開選單 -->
                                <div id="menu-${id}" class="hidden absolute right-0 top-6 bg-white border border-gray-100 shadow-lg rounded-xl py-1 z-30 w-20 text-center">
                                    <button data-id="${id}" class="edit-btn w-full py-1.5 text-[11px] text-gray-700 hover:bg-gray-50 font-bold">編輯</button>
                                    <button data-id="${id}" class="delete-btn w-full py-1.5 text-[11px] text-red-500 hover:bg-red-50 font-bold">刪除</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    ${item.treatments ? `<div class="text-xs text-gray-700 font-bold bg-gray-50/80 p-2 rounded-xl">診治：${item.treatments}</div>` : ''}
                    ${item.notes ? `<div class="text-xs text-gray-500 italic pl-1">備註：${item.notes}</div>` : ''}
                `;

                historyList.appendChild(card);
            });

            document.getElementById('totalCost').innerText = `NT$ ${totalSpent.toLocaleString()}`;
            document.getElementById('totalVisits').innerText = keys.length;

            // 三點選單點擊切換
            document.querySelectorAll('.menu-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = e.currentTarget.getAttribute('data-id');
                    const targetMenu = document.getElementById(`menu-${id}`);
                    
                    // 關閉其他選單
                    document.querySelectorAll('[id^="menu-"]').forEach(m => {
                        if (m !== targetMenu) m.classList.add('hidden');
                    });

                    targetMenu.classList.toggle('hidden');
                });
            });

            // 編輯與刪除觸發
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    openEditModal(e.currentTarget.getAttribute('data-id'));
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    if (confirm('確定要刪除這筆看診紀錄嗎？')) {
                        remove(ref(db, `braces_records/${id}`));
                    }
                });
            });
        }

        // 點擊空白處自動關閉選單
        document.addEventListener('click', () => {
            document.querySelectorAll('[id^="menu-"]').forEach(m => m.classList.add('hidden'));
        });

        // 表單提交：新增紀錄
        document.getElementById('visitForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const date = document.getElementById('visitDate').value;
            const baseFee = document.getElementById('baseFee').value || 0;
            const hasCavity = document.getElementById('hasCavity').checked;
            const extraFee = hasCavity ? (document.getElementById('extraFee').value || 0) : 0;
            const treatments = document.getElementById('treatments').value.trim();
            const notes = document.getElementById('notes').value.trim();

            const nextDate = document.getElementById('nextDateInput').value;
            const nextTime = document.getElementById('nextTimeInput').value;

            const newRecord = {
                date,
                baseFee,
                hasCavity,
                extraFee,
                treatments,
                notes,
                createdAt: Date.now()
            };

            // 新增至歷史
            push(bracesRef, newRecord).then(() => {
                // 若有設定下一次時間，同步更新頂部
                if (nextDate) {
                    set(nextApptRef, { date: nextDate, time: nextTime });
                }

                // 清空表單
                document.getElementById('treatments').value = '';
                document.getElementById('notes').value = '';
                document.getElementById('hasCavity').checked = false;
                cavityFeeBox.classList.add('hidden');
                document.getElementById('nextDateInput').value = '';
                document.getElementById('nextTimeInput').value = '';
                document.getElementById('visitDate').value = new Date().toISOString().split('T')[0];

                alert('紀錄已成功儲存！');
            });
        });

        // 頂部鉛筆按鈕：開關修改下次回診 Modal
        document.getElementById('btnEditNextAppointment').addEventListener('click', () => {
            document.getElementById('nextApptModal').classList.remove('hidden');
        });
        document.getElementById('closeNextApptModal').addEventListener('click', () => {
            document.getElementById('nextApptModal').classList.add('hidden');
        });

        // 更新下次回診 Modal 提交
        document.getElementById('nextApptForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const date = document.getElementById('modalNextDate').value;
            const time = document.getElementById('modalNextTime').value;

            set(nextApptRef, { date, time }).then(() => {
                document.getElementById('nextApptModal').classList.add('hidden');
            });
        });

        // 歷史紀錄編輯 Modal
        function openEditModal(id) {
            const item = allRecords[id];
            if (!item) return;

            document.getElementById('editRecordId').value = id;
            document.getElementById('editDate').value = item.date;
            document.getElementById('editBaseFee').value = item.baseFee || 3000;
            document.getElementById('editExtraFee').value = item.extraFee || 0;
            document.getElementById('editTreatments').value = item.treatments || '';
            document.getElementById('editNotes').value = item.notes || '';

            document.getElementById('editModal').classList.remove('hidden');
        }

        document.getElementById('closeEditModal').addEventListener('click', () => {
            document.getElementById('editModal').classList.add('hidden');
        });

        document.getElementById('editForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const id = document.getElementById('editRecordId').value;
            const extraFeeVal = Number(document.getElementById('editExtraFee').value) || 0;

            const updatedData = {
                date: document.getElementById('editDate').value,
                baseFee: document.getElementById('editBaseFee').value,
                hasCavity: extraFeeVal > 0,
                extraFee: extraFeeVal,
                treatments: document.getElementById('editTreatments').value.trim(),
                notes: document.getElementById('editNotes').value.trim()
            };

            update(ref(db, `braces_records/${id}`), updatedData).then(() => {
                document.getElementById('editModal').classList.add('hidden');
            });
        });
    </script>
</body>
</html>

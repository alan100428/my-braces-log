<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Braces Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 pb-20">

    <!-- Header -->
    <header class="bg-teal-700 text-white p-4 text-center font-bold text-lg tracking-widest shadow-sm sticky top-0 z-40">
        My Braces Log
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- 區塊：下次回診時間 (可隨手點擊全卡片修改) -->
        <div id="nextAppointmentCard" class="bg-teal-800 text-white p-4 rounded-xl shadow-md cursor-pointer transition hover:bg-teal-900 active:scale-[0.99]">
            <div class="flex justify-between items-center text-xs text-teal-200 font-medium">
                <span>下次回診預約</span>
                <span id="countdownBadge" class="bg-teal-700 text-teal-100 px-2 py-0.5 rounded-full text-[10px]">尚未設定</span>
            </div>
            <div class="mt-2 flex items-baseline justify-between">
                <div id="nextAppointmentText" class="text-xl font-bold tracking-tight">點擊設定回診時間</div>
                <div id="nextAppointmentTimeText" class="text-sm font-medium text-teal-200"></div>
            </div>
        </div>

        <!-- 區塊：費用與次數統計 -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm text-center">
                <div class="text-[11px] text-gray-500 font-medium mb-0.5">累積總花費</div>
                <div class="text-lg font-bold text-teal-700" id="totalCost">NT$ 0</div>
            </div>
            <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm text-center">
                <div class="text-[11px] text-gray-500 font-medium mb-0.5">總回診次數</div>
                <div class="text-lg font-bold text-gray-800"><span id="totalVisits">0</span> 次</div>
            </div>
        </div>

        <!-- TAB 1: 新增紀錄頁面 -->
        <div id="tabAddContent" class="space-y-4">
            <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-200 space-y-3">
                <div class="font-bold text-sm text-gray-800 border-b pb-2">新增看診紀錄</div>

                <form id="visitForm" class="space-y-3 text-xs">
                    
                    <!-- 日期與基本費用 -->
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block font-medium text-gray-600 mb-1">本次看診日期</label>
                            <input type="date" id="visitDate" class="w-full border rounded-lg p-2 bg-gray-50 focus:bg-white outline-none" required>
                        </div>
                        <div>
                            <label class="block font-medium text-gray-600 mb-1">常規費用 (元)</label>
                            <input type="number" id="baseFee" value="3000" class="w-full border rounded-lg p-2 bg-gray-50 focus:bg-white outline-none">
                        </div>
                    </div>

                    <!-- 下次回診預約時間 (必填) -->
                    <div class="p-3 bg-gray-50 border border-gray-200 rounded-lg space-y-2">
                        <label class="block font-bold text-teal-800">下次回診預約時間</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="date" id="nextVisitDateInput" class="w-full border rounded-lg p-2 bg-white outline-none" required>
                            <input type="time" id="nextVisitTimeInput" value="14:00" class="w-full border rounded-lg p-2 bg-white outline-none" required>
                        </div>
                    </div>

                    <!-- 開藥 / 補蛀牙 -->
                    <div class="p-3 bg-teal-50/60 border border-teal-100 rounded-lg space-y-2">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="hasCavity" class="w-4 h-4 text-teal-700 rounded focus:ring-teal-600">
                            <span class="font-medium text-teal-900">當次有開藥 / 補蛀牙</span>
                        </label>

                        <div id="cavityFeeBox" class="hidden pl-6 pt-1">
                            <label class="block font-medium text-teal-800 mb-1">額外掛號 / 藥費 (元)</label>
                            <input type="number" id="extraFee" value="200" class="w-full border rounded-lg p-2 bg-white outline-none">
                        </div>
                    </div>

                    <!-- 診療項目 -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="font-medium text-gray-600">診療項目</label>
                            <button type="button" id="btnQuickAdjust" class="bg-teal-100 text-teal-800 text-[11px] font-medium px-2 py-0.5 rounded hover:bg-teal-200 transition">
                                ＋ 調整
                            </button>
                        </div>
                        <input type="text" id="treatments" placeholder="例：調整、換橡皮筋" class="w-full border rounded-lg p-2 bg-gray-50 focus:bg-white outline-none">
                    </div>

                    <!-- 備註說明 -->
                    <div>
                        <label class="block font-medium text-gray-600 mb-1">備註 / 醫囑紀錄</label>
                        <textarea id="notes" rows="2" placeholder="例：橡皮筋每天替換..." class="w-full border rounded-lg p-2 bg-gray-50 focus:bg-white outline-none resize-none"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-teal-700 text-white font-bold py-3 rounded-xl hover:bg-teal-800 transition shadow-sm">
                        儲存看診紀錄
                    </button>
                </form>
            </div>
        </div>

        <!-- TAB 2: 看診歷史紀錄頁面 -->
        <div id="tabHistoryContent" class="space-y-3 hidden">
            <div id="historyList" class="space-y-3">
                <div class="text-center py-12 text-gray-400 text-xs">載入紀錄中...</div>
            </div>
        </div>

    </main>

    <!-- 底部 Tab 導覽列 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around p-2 z-40 max-w-md mx-auto">
        <button id="navAdd" class="flex-1 py-1.5 text-center text-xs font-bold text-teal-700 flex flex-col items-center gap-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            新增紀錄
        </button>
        <button id="navHistory" class="flex-1 py-1.5 text-center text-xs font-bold text-gray-400 flex flex-col items-center gap-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            歷史紀錄
        </button>
    </nav>

    <!-- 快速設定下次回診 Modal -->
    <div id="nextAppModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl p-4 w-full max-w-sm space-y-3 shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-gray-800">下次回診預約時間</h3>
                <button id="closeNextAppModal" class="text-gray-400 hover:text-black font-bold">✕</button>
            </div>
            <form id="nextAppForm" class="space-y-3 text-xs">
                <div>
                    <label class="font-medium text-gray-600 block mb-1">預約日期</label>
                    <input type="date" id="modalNextDate" class="w-full border rounded-lg p-2" required>
                </div>
                <div>
                    <label class="font-medium text-gray-600 block mb-1">預約時間</label>
                    <input type="time" id="modalNextTime" class="w-full border rounded-lg p-2" required>
                </div>
                <button type="submit" class="w-full bg-teal-700 text-white font-bold py-2.5 rounded-lg text-sm shadow-sm">儲存更新</button>
            </form>
        </div>
    </div>

    <!-- 編輯紀錄 Modal (不含下次回診) -->
    <div id="editModal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl p-4 w-full max-w-sm space-y-3 shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-gray-800">修改紀錄內容</h3>
                <button id="closeEditModal" class="text-gray-400 hover:text-black font-bold">✕</button>
            </div>
            <form id="editForm" class="space-y-3 text-xs">
                <input type="hidden" id="editRecordId">
                <div>
                    <label class="font-medium text-gray-600">看診日期</label>
                    <input type="date" id="editDate" class="w-full border rounded-lg p-2 mt-1" required>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="font-medium text-gray-600">常規費用 (元)</label>
                        <input type="number" id="editBaseFee" class="w-full border rounded-lg p-2 mt-1">
                    </div>
                    <div>
                        <label class="font-medium text-gray-600">額外費用 (元)</label>
                        <input type="number" id="editExtraFee" class="w-full border rounded-lg p-2 mt-1">
                    </div>
                </div>
                <div>
                    <label class="font-medium text-gray-600">診療項目</label>
                    <input type="text" id="editTreatments" class="w-full border rounded-lg p-2 mt-1">
                </div>
                <div>
                    <label class="font-medium text-gray-600">備註</label>
                    <textarea id="editNotes" rows="2" class="w-full border rounded-lg p-2 mt-1 resize-none"></textarea>
                </div>
                <button type="submit" class="w-full bg-teal-700 text-white font-bold py-2.5 rounded-lg text-sm shadow-sm">更新資料</button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, update, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBwF163OMp-1sPCV9xHsORYemEy97YPCkI",
            authDomain: "mywardrobe-c7e74.firebaseapp.com",
            databaseURL: "https://mywardrobe-c7e74-default-rtdb.firebaseio.com",
            projectId: "mywardrobe-c7e74",
            storageBucket: "mywardrobe-c7e74.firebasestorage.app",
            messagingSenderId: "629621991380",
            appId: "1:629621991380:web:5ab788261e3ec50a79d841"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        const bracesRef = ref(db, 'braces_records');
        const nextAppRef = ref(db, 'next_appointment');

        let allRecords = {};
        let activeMenuId = null;

        // 初始化日期預設值
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('visitDate').value = todayStr;
        
        // 預設下次回診預設為 3 週後
        const defaultNextDate = new Date();
        defaultNextDate.setDate(defaultNextDate.getDate() + 21);
        document.getElementById('nextVisitDateInput').value = defaultNextDate.toISOString().split('T')[0];

        // 頁面 Tab 切換邏輯
        const navAdd = document.getElementById('navAdd');
        const navHistory = document.getElementById('navHistory');
        const tabAddContent = document.getElementById('tabAddContent');
        const tabHistoryContent = document.getElementById('tabHistoryContent');

        navAdd.addEventListener('click', () => {
            tabAddContent.classList.remove('hidden');
            tabHistoryContent.classList.add('hidden');
            navAdd.className = "flex-1 py-1.5 text-center text-xs font-bold text-teal-700 flex flex-col items-center gap-1";
            navHistory.className = "flex-1 py-1.5 text-center text-xs font-bold text-gray-400 flex flex-col items-center gap-1";
        });

        navHistory.addEventListener('click', () => {
            tabHistoryContent.classList.remove('hidden');
            tabAddContent.classList.add('hidden');
            navHistory.className = "flex-1 py-1.5 text-center text-xs font-bold text-teal-700 flex flex-col items-center gap-1";
            navAdd.className = "flex-1 py-1.5 text-center text-xs font-bold text-gray-400 flex flex-col items-center gap-1";
        });

        // 快速選擇「調整」
        const treatmentsInput = document.getElementById('treatments');
        document.getElementById('btnQuickAdjust').addEventListener('click', () => {
            const currentVal = treatmentsInput.value.trim();
            if (!currentVal) {
                treatmentsInput.value = '調整';
            } else if (!currentVal.includes('調整')) {
                treatmentsInput.value = '調整、' + currentVal;
            }
            treatmentsInput.focus();
        });

        // 開藥/補蛀牙勾選顯示
        const hasCavityCheckbox = document.getElementById('hasCavity');
        const cavityFeeBox = document.getElementById('cavityFeeBox');
        hasCavityCheckbox.addEventListener('change', (e) => {
            cavityFeeBox.classList.toggle('hidden', !e.target.checked);
        });

        // 監聽「下次回診時間」資料
        onValue(nextAppRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.date) {
                updateNextAppointmentDisplay(data.date, data.time);
            } else {
                document.getElementById('nextAppointmentText').innerText = "未設定預約";
                document.getElementById('nextAppointmentTimeText').innerText = "";
                document.getElementById('countdownBadge').innerText = "點擊設定";
            }
        });

        function updateNextAppointmentDisplay(dateStr, timeStr) {
            const textEl = document.getElementById('nextAppointmentText');
            const timeEl = document.getElementById('nextAppointmentTimeText');
            const badgeEl = document.getElementById('countdownBadge');

            textEl.innerText = dateStr;
            timeEl.innerText = timeStr || '';

            // 計算倒數天數
            const targetDate = new Date(dateStr);
            const today = new Date();
            today.setHours(0,0,0,0);
            targetDate.setHours(0,0,0,0);

            const diffTime = targetDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays === 0) {
                badgeEl.innerText = "今天看診";
                badgeEl.className = "bg-amber-500 text-white px-2 py-0.5 rounded-full text-[10px]";
            } else if (diffDays > 0) {
                badgeEl.innerText = `還有 ${diffDays} 天`;
                badgeEl.className = "bg-teal-700 text-teal-100 px-2 py-0.5 rounded-full text-[10px]";
            } else {
                badgeEl.innerText = "已過期";
                badgeEl.className = "bg-gray-600 text-gray-200 px-2 py-0.5 rounded-full text-[10px]";
            }

            // 同步 Modal 數值
            document.getElementById('modalNextDate').value = dateStr;
            document.getElementById('modalNextTime').value = timeStr || '14:00';
        }

        // 點擊頂部卡片直接打開預約修改 Modal
        document.getElementById('nextAppointmentCard').addEventListener('click', () => {
            document.getElementById('nextAppModal').classList.remove('hidden');
        });

        document.getElementById('closeNextAppModal').addEventListener('click', () => {
            document.getElementById('nextAppModal').classList.add('hidden');
        });

        document.getElementById('nextAppForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const date = document.getElementById('modalNextDate').value;
            const time = document.getElementById('modalNextTime').value;

            set(nextAppRef, { date, time }).then(() => {
                document.getElementById('nextAppModal').classList.add('hidden');
            });
        });

        // 監聽看診歷史資料
        onValue(bracesRef, (snapshot) => {
            allRecords = snapshot.val() || {};
            renderHistory();
        });

        function renderHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';

            const keys = Object.keys(allRecords);
            
            if (keys.length === 0) {
                historyList.innerHTML = `<div class="text-center py-12 text-gray-400 text-xs">目前尚無紀錄</div>`;
                document.getElementById('totalCost').innerText = 'NT$ 0';
                document.getElementById('totalVisits').innerText = '0';
                return;
            }

            keys.sort((a, b) => new Date(allRecords[b].date) - new Date(allRecords[a].date));

            let totalSpent = 0;

            keys.forEach((id) => {
                const item = allRecords[id];
                const base = Number(item.baseFee) || 0;
                const extra = item.hasCavity ? (Number(item.extraFee) || 0) : 0;
                const totalFee = base + extra;
                totalSpent += totalFee;

                const card = document.createElement('div');
                card.className = "bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm space-y-2 relative";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs font-bold text-gray-800">${item.date}</span>
                            ${item.hasCavity ? `<span class="ml-2 bg-amber-50 text-amber-700 border border-amber-200 text-[10px] px-1.5 py-0.5 rounded font-medium">開藥 / 補蛀牙</span>` : ''}
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="text-right">
                                <span class="text-sm font-bold text-teal-700">NT$ ${totalFee.toLocaleString()}</span>
                            </div>
                            <!-- 三點隱藏式選單按鈕 -->
                            <button data-id="${id}" class="menu-btn text-gray-400 hover:text-gray-700 p-1 rounded-lg">
                                <svg class="w-4 h-4 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                            </button>
                        </div>
                    </div>

                    ${item.treatments ? `<div class="text-xs text-gray-700 font-medium bg-gray-50 p-2 rounded-lg">${item.treatments}</div>` : ''}
                    ${item.notes ? `<div class="text-xs text-gray-500 pl-1">${item.notes}</div>` : ''}

                    <!-- 隱藏懸浮選單 -->
                    <div id="popover-${id}" class="hidden absolute right-3 top-10 bg-white border border-gray-200 rounded-lg shadow-lg z-20 py-1 text-xs w-20">
                        <button data-id="${id}" class="edit-btn w-full text-left px-3 py-1.5 text-gray-700 hover:bg-gray-50">修改</button>
                        <button data-id="${id}" class="delete-btn w-full text-left px-3 py-1.5 text-red-600 hover:bg-red-50">刪除</button>
                    </div>
                `;

                historyList.appendChild(card);
            });

            document.getElementById('totalCost').innerText = `NT$ ${totalSpent.toLocaleString()}`;
            document.getElementById('totalVisits').innerText = keys.length;

            // 綁定選單開關事件
            document.querySelectorAll('.menu-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.getAttribute('data-id');
                    const pop = document.getElementById(`popover-${id}`);
                    
                    // 關閉其他開啟的選單
                    document.querySelectorAll('[id^="popover-"]').forEach(el => {
                        if (el.id !== `popover-${id}`) el.classList.add('hidden');
                    });

                    pop.classList.toggle('hidden');
                });
            });

            // 點擊其他地方關閉選單
            document.addEventListener('click', () => {
                document.querySelectorAll('[id^="popover-"]').forEach(el => el.classList.add('hidden'));
            });

            // 編輯與刪除觸發事件
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    openEditModal(e.target.getAttribute('data-id'));
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    if (confirm('確定刪除此紀錄？')) {
                        remove(ref(db, `braces_records/${id}`));
                    }
                });
            });
        }

        // 送出新增紀錄
        document.getElementById('visitForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const date = document.getElementById('visitDate').value;
            const baseFee = document.getElementById('baseFee').value || 0;
            const hasCavity = document.getElementById('hasCavity').checked;
            const extraFee = hasCavity ? (document.getElementById('extraFee').value || 0) : 0;
            const treatments = document.getElementById('treatments').value.trim();
            const notes = document.getElementById('notes').value.trim();

            const nextDate = document.getElementById('nextVisitDateInput').value;
            const nextTime = document.getElementById('nextVisitTimeInput').value;

            const newRecord = {
                date,
                baseFee,
                hasCavity,
                extraFee,
                treatments,
                notes,
                createdAt: Date.now()
            };

            // 同時新增紀錄與更新最上方的下次回診時間
            push(bracesRef, newRecord).then(() => {
                return set(nextAppRef, { date: nextDate, time: nextTime });
            }).then(() => {
                // 重置表單
                document.getElementById('treatments').value = '';
                document.getElementById('notes').value = '';
                document.getElementById('hasCavity').checked = false;
                cavityFeeBox.classList.add('hidden');
                document.getElementById('visitDate').value = todayStr;

                // 自動切換至歷史紀錄頁面
                navHistory.click();
            });
        });

        // 編輯 Modal 邏輯
        function openEditModal(id) {
            const item = allRecords[id];
            if (!item) return;

            document.getElementById('editRecordId').value = id;
            document.getElementById('editDate').value = item.date;
            document.getElementById('editBaseFee').value = item.baseFee || 3000;
            document.getElementById('editExtraFee').value = item.extraFee || 0;
            document.getElementById('editTreatments').value = item.treatments || '';
            document.getElementById('editNotes').value = item.notes || '';

            document.getElementById('editModal').classList.remove('hidden');
        }

        document.getElementById('closeEditModal').addEventListener('click', () => {
            document.getElementById('editModal').classList.add('hidden');
        });

        document.getElementById('editForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const id = document.getElementById('editRecordId').value;
            const extraFeeVal = Number(document.getElementById('editExtraFee').value) || 0;

            const updatedData = {
                date: document.getElementById('editDate').value,
                baseFee: document.getElementById('editBaseFee').value,
                hasCavity: extraFeeVal > 0,
                extraFee: extraFeeVal,
                treatments: document.getElementById('editTreatments').value.trim(),
                notes: document.getElementById('editNotes').value.trim()
            };

            update(ref(db, `braces_records/${id}`), updatedData).then(() => {
                document.getElementById('editModal').classList.add('hidden');
            });
        });
    </script>
</body>
</html>
